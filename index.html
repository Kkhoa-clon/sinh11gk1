<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">

    <!-- Main Container -->

        <!-- Progress Bar -->

            <div id="progress-bar" class="bg-emerald-500 h-2 rounded-full w-0 transition-all duration-300"></div>
        </div>

        <!-- Question Card -->
        <div id="quiz-card" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-start mb-4">
                    <span id="question-tag" class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider">

                    </span>

                </div>

                </div>
            </div>

            <!-- Rationale & Feedback -->

                <div class="flex gap-3 mt-4">
                    <button id="prev-btn" class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-lg transition">

                    </button>
                    <button id="next-btn" class="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition">

                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        Đề cương ôn tập Sinh Học 11 - Năm học 2026-2027 (Đầy đủ 91 câu)
    </footer>

    <script>
        const questionsData = [
            { id: 1, question: "Nguyên tố dinh dưỡng khoáng thiết yếu trong cây là nguyên tố", options: [{text: "thiếu nó cây không hoàn thành được chu trình sống.", isCorrect: true, rationale: "Nguyên tố khoáng thiết yếu là nguyên tố mà thiếu nó cây không thể hoàn thành chu trình sống."}, {text: "có thể thay thế bởi một nguyên tố khác khi cây cần sử dụng.", isCorrect: false, rationale: "Nguyên tố khoáng thiết yếu có tính đặc hiệu cao không thể thay thế."}, {text: "tham gia gián tiếp vào quá trình chuyển hóa vật chất.", isCorrect: false, rationale: "Trực tiếp tham gia vào quá trình chuyển hóa."}, {text: "chiếm hàm lượng lớn hơn các nguyên tố khác trong cơ thể.", isCorrect: false, rationale: "Hàm lượng không quyết định tính thiết yếu."}], hint: "Định nghĩa về nguyên tố khoáng thiết yếu." },
            { id: 2, question: "Nguyên tố vi lượng chỉ cần với một hàm lượng rất nhỏ nhưng nếu không có nó thì cây sẽ còi cọc và có thể bị chết. Nguyên nhân chủ yếu là vì các nguyên tố vi lượng có vai trò", options: [{text: "hoạt hóa enzyme trong trao đổi chất.", isCorrect: true, rationale: "Các nguyên tố vi lượng thường đóng vai trò là cofactor hoạt hóa enzyme."}, {text: "tham gia cấu trúc nền tế bào.", isCorrect: false, rationale: "Đây là vai trò chính của nguyên tố đa lượng."}, {text: "qui định áp suất thẩm thấu của dịch tế bào.", isCorrect: false, rationale: "Chủ yếu do các ion đa lượng quyết định."}, {text: "thúc đẩy quá trình chín của quả và hạt.", isCorrect: false, rationale: "Do các chất điều hòa sinh trưởng quy định."}], hint: "Thành phần và chức năng xúc tác của vi lượng." },
            { id: 3, question: "Nguyên tố đa lượng đóng vai trò chủ yếu", options: [{text: "tham gia cấu trúc nền tế bào.", isCorrect: true, rationale: "Nguyên tố đa lượng cấu tạo nên các đại phân tử sinh học và cấu trúc tế bào."}, {text: "hoạt hóa enzyme trong trao đổi chất.", isCorrect: false, rationale: "Là vai trò của vi lượng."}, {text: "qui định áp suất thẩm thấu của dịch tế bào.", isCorrect: false, rationale: "Dù có tham gia nhưng cấu trúc nền tế bào mới là vai trò chính."}, {text: "thúc đẩy quá trình chín của quả và hạt.", isCorrect: false, rationale: "Không phải vai trò chính."}], hint: "Thành phần xây dựng nên cơ thể thực vật." },
            { id: 4, question: "Ở thực vật, nguyên tố nào sau đây là thành phần của diệp lục, hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate?", options: [{text: "Magnesium.", isCorrect: true, rationale: "Magnesium (Mg) nằm ở trung tâm của phân tử diệp lục."}, {text: "Calcium.", isCorrect: false, rationale: "Calcium có trong thành tế bào."}, {text: "Nitrogen.", isCorrect: false, rationale: "Nitrogen có trong diệp lục nhưng không trực tiếp hoạt hóa vận chuyển phosphate."}, {text: "Potassium.", isCorrect: false, rationale: "Potassium chủ yếu điều hòa cân bằng ion."}], hint: "Ion kim loại trung tâm trong nhân diệp lục." },
            { id: 5, question: "Phát biểu nào sau đây là đúng về vai trò của Calcium (Ca) đối với thực vật?", options: [{text: "Thành phần của thành tế bào, hoạt hóa enzyme thủy phân ATP và phospholipid.", isCorrect: true, rationale: "Ca liên kết với pectin tạo calcium pectate ở thành tế bào."}, {text: "Thành phần của diệp lục, tham gia hoạt hóa enzyme liên quan đến sự vận chuyển gốc phosphate.", isCorrect: false, rationale: "Là vai trò của Mg."}, {text: "Thành phần của nucleic acid, phospholipid, ATP và một số coenzyme.", isCorrect: false, rationale: "Là vai trò của P."}, {text: "Thành phần của cytochrome, hoạt hóa enzyme của quá trình tổng hợp diệp lục.", isCorrect: false, rationale: "Là vai trò của Fe."}], hint: "Liên quan đến độ cứng cáp của thành tế bào." },
            { id: 6, question: "Vai trò của Kali (K) đối với thực vật là", options: [{text: "Chủ yếu giữ cân bằng nước và ion trong tế bào, hoạt hóa enzyme, mở khí khổng.", isCorrect: true, rationale: "Kali điều hòa áp suất thẩm thấu, đóng mở khí khổng và cân bằng ion."}, {text: "Thành phần của protein và nucleic acid.", isCorrect: false, rationale: "Là vai trò của N."}, {text: "Thành phần của nucleic acid, ATP, phospholipid, coenzyme.", isCorrect: false, rationale: "Là vai trò của P."}, {text: "Thành phần của thành tế bào, màng tế bào, hoạt hóa enzyme.", isCorrect: false, rationale: "Không đóng vai trò cấu trúc chính như Ca."}], hint: "Ion quan trọng nhất điều hòa sự đóng mở khí khổng." },
            { id: 7, question: "Nước được vận chuyển ở thân chủ yếu", options: [{text: "trong mạch gỗ.", isCorrect: true, rationale: "Mạch gỗ (xylem) chuyên chở nước và khoáng từ rễ lên lá."}, {text: "từ mạch gỗ sang mạch rây.", isCorrect: false, rationale: "Quá trình di chuyển ngang chỉ diễn ra khi cần điều hòa."}, {text: "từ mạch rây sang mạch gỗ.", isCorrect: false, rationale: "Không phải hướng chính."}, {text: "trong mạch rây.", isCorrect: false, rationale: "Mạch rây vận chuyển chất hữu cơ."}], hint: "Dòng vận chuyển đi lên trong cây." },
            { id: 8, question: "Phần lớn nước sau khi hấp thụ được sẽ thoát ra khỏi lá dưới dạng hơi nước qua", options: [{text: "khí khổng.", isCorrect: true, rationale: "Khoảng 90% lượng nước thoát qua khí khổng."}, {text: "cutin.", isCorrect: false, rationale: "Thoát hơi nước qua cutin chiếm tỷ lệ nhỏ."}, {text: "mạch gỗ.", isCorrect: false, rationale: "Mạch gỗ chỉ vận chuyển nước, không trực tiếp thoát hơi nước ra môi trường."}, {text: "bề mặt thân.", isCorrect: false, rationale: "Tỷ lệ rất nhỏ."}], hint: "Cơ quan đóng mở điều tiết thoát hơi nước." },
            { id: 9, question: "Trong các trường hợp cung cấp Nitrogen: I. Phóng điện giông ($N_2 \\rightarrow nitrate$); II. Cố định $N_2$ sinh học & phân giải vi sinh vật; III. Phân bón con người; IV. Nguồn nitrogen trong nham thạch núi lửa. Có bao nhiêu trường hợp KHÔNG phải nguồn nitrate và ammonium tự nhiên?", options: [{text: "1.", isCorrect: true, rationale: "Trường hợp III (phân bón do con người nhân tạo) không phải nguồn tự nhiên."}, {text: "2.", isCorrect: false, rationale: "Chỉ có 1 trường hợp nhân tạo."}, {text: "3.", isCorrect: false, rationale: "Sai số lượng."}, {text: "4.", isCorrect: false, rationale: "Sai số lượng."}], hint: "Tìm yếu tố do tác động của con người." },
            { id: 10, question: "Quá trình khử nitrat là quá trình chuyển hóa", options: [{text: "$NO_3^-$ thành $NH_4^+$.", isCorrect: true, rationale: "Khử nitrat là quá trình biến đổi dạng oxy hóa $NO_3^-$ thành dạng khử $NH_4^+$ trong cây."}, {text: "$NO_3^-$ thành $NO_2^-$.", isCorrect: false, rationale: "Chỉ là bước trung gian."}, {text: "$NH_4^+$ thành $NO_2^-$.", isCorrect: false, rationale: "Đây là quá trình nitrat hóa do vi khuẩn."}, {text: "$NO_2^-$ thành $NO_3^-$.", isCorrect: false, rationale: "Đây là quá trình oxy hóa."}], hint: "Chuyển hóa dạng nitrat thành dạng ammonium." },
            { id: 11, question: "Khi nói về dòng mạch gỗ, phát biểu nào KHÔNG đúng?", options: [{text: "Mạch gỗ được cấu tạo bởi các tế bào sống, thành tế bào thấm lignin.", isCorrect: false, rationale: "Phát biểu này SAI vì tế bào mạch gỗ là các tế bào CHẾT (quản bào và mạch ống)."}, {text: "Nước và chất khoáng từ rễ, qua thân, lên lá theo mạch gỗ.", isCorrect: true, rationale: "Phát biểu này đúng."}, {text: "Thành phần chủ yếu của dịch mạch gỗ là nước, chất khoáng và một số chất tan khác.", isCorrect: true, rationale: "Phát biểu này đúng."}, {text: "Các tế bào mạch gỗ xếp chồng lên nhau theo chiều thẳng đứng, thông với nhau qua các lỗ.", isCorrect: true, rationale: "Phát biểu này đúng."}], hint: "Chú ý trạng thái sống/chết của tế bào mạch gỗ." },
            { id: 12, question: "Khi nói về dòng mạch rây, có bao nhiêu phát biểu sau đây ĐÚNG?\nI. Trong mạch rây, các chất vận chuyển chỉ di chuyển theo một hướng, từ lá xuống rễ.\nII. Các tế bào ống rây xếp chồng lên nhau thông với nhau qua các lỗ rây.\nIII. Thành phần chủ yếu là nước và chất khoáng.\nIV. Mạch rây có thể nhận nước từ mạch gỗ chuyển sang.", options: [{text: "2.", isCorrect: true, rationale: "Có 2 phát biểu đúng là II và IV. Phát biểu I sai vì dịch mạch rây có thể di chuyển từ cơ quan chứa lên cơ quan tiêu thụ. Phát biểu III sai vì thành phần chủ yếu là sucrose và chất hữu cơ."}, {text: "1.", isCorrect: false, rationale: "Sai số lượng."}, {text: "3.", isCorrect: false, rationale: "Sai số lượng."}, {text: "4.", isCorrect: false, rationale: "Sai số lượng."}], hint: "Đánh giá từng nhận định về hướng vận chuyển và thành phần dịch mạch rây." },
            { id: 13, question: "Các chất khoáng được hấp thụ từ đất vào tế bào lông hút theo cơ chế thụ động phụ thuộc vào", options: [{text: "Chênh lệch nồng độ ion.", isCorrect: true, rationale: "Thụ động đi từ nơi nồng độ cao đến nồng độ thấp (theo gradient nồng độ)."}, {text: "Hoạt động trao đổi chất.", isCorrect: false, rationale: "Yếu tố này tác động chủ yếu đến hấp thụ chủ động."}, {text: "Cung cấp năng lượng.", isCorrect: false, rationale: "Cơ chế thụ động không tiêu tốn ATP."}, {text: "Hoạt động thẩm thấu.", isCorrect: false, rationale: "Thẩm thấu dùng cho sự vận chuyển của phân tử nước."}], hint: "Cơ chế không tốn năng lượng dựa trên chênh lệch nồng độ." },
            { id: 14, question: "Chất khoáng được hấp thụ vào rễ theo cơ chế", options: [{text: "Thụ động và chủ động.", isCorrect: true, rationale: "Cây có thể hấp thụ khoáng theo cả 2 cơ chế thụ động và chủ động."}, {text: "Thụ động.", isCorrect: false, rationale: "Chưa đầy đủ."}, {text: "Chủ động.", isCorrect: false, rationale: "Chưa đầy đủ."}, {text: "Không mang tính chọn lọc.", isCorrect: false, rationale: "Hấp thụ khoáng có tính chọn lọc cao."}], hint: "Bao gồm cả cơ chế theo gradient và ngược gradient nồng độ." },
            { id: 15, question: "Điều nào sau đây KHÔNG đúng về vai trò của quá trình thoát hơi nước?", options: [{text: "Cung cấp năng lượng cho lá.", isCorrect: true, rationale: "Thoát hơi nước không cung cấp năng lượng; năng lượng được tạo ra từ quang hợp/hô hấp."}, {text: "Vận chuyển nước, ion khoáng.", isCorrect: false, rationale: "Là vai trò chính tạo động lực đầu trên."}, {text: "Cung cấp $CO_2$ cho quá trình quang hợp.", isCorrect: false, rationale: "Khí khổng mở giúp $CO_2$ khuếch tán vào."}, {text: "Hạ nhiệt độ cho lá.", isCorrect: false, rationale: "Giúp lá không bị bốc cháy dưới ánh nắng."}], hint: "Thoát hơi nước là quá trình vật lý - sinh lý, không tạo ra năng lượng." },
            { id: 16, question: "Phát biểu đúng khi nói đến ảnh hưởng của độ ẩm đến quá trình thoát hơi nước ở lá là", options: [{text: "Độ ẩm không khí càng thấp, sự thoát hơi nước càng mạnh.", isCorrect: true, rationale: "Độ ẩm không khí thấp làm tăng chênh lệch thế nước giữa lá và không khí."}, {text: "Độ ẩm không khí càng cao, sự thoát hơi nước không diễn ra.", isCorrect: false, rationale: "Vẫn diễn ra nhưng rất yếu."}, {text: "Độ ẩm không khí càng thấp, sự thoát hơi nước càng yếu.", isCorrect: false, rationale: "Trái ngược với nguyên lý khuếch tán."}, {text: "Độ ẩm không khí càng cao, sự thoát hơi nước càng mạnh.", isCorrect: false, rationale: "Sai logic."}], hint: "Độ ẩm không khí khô hanh làm nước bay hơi như thế nào?" },
            { id: 17, question: "“Nước đi vào ...(1)... theo con đường gian bào đến nội bì thì chuyển sang con đường tế bào chất vì tế bào nội bì có đai Caspary ...(2)... nước nên nước ...(2)... qua được”. Từ/cụm từ điền vào (1), (2) là:", options: [{text: "1 – mạch gỗ; 2 – không thấm.", isCorrect: true, rationale: "Đai Caspary không thấm nước, buộc nước chuyển sang con đường tế bào chất để vào mạch gỗ."}, {text: "1 – mạch rây; 2 – không thấm.", isCorrect: false, rationale: "Nước đi vào mạch gỗ chứ không phải mạch rây."}, {text: "1 – mạch rây; 2 – thấm.", isCorrect: false, rationale: "Sai cả 2 vị trí."}, {text: "1 – mạch gỗ; 2 – thấm.", isCorrect: false, rationale: "Đai Caspary không thấm nước."}], hint: "Tính chất chống thấm của đai Caspary." },
            { id: 18, question: "Nước và các chất khoáng được vận chuyển từ lông hút vào mạch gỗ của rễ theo hai con đường đó là", options: [{text: "con đường gian bào và con đường tế bào chất.", isCorrect: true, rationale: "Hai con đường vận chuyển qua lớp vỏ rễ."}, {text: "con đường gian bào và con đường biểu bì.", isCorrect: false, rationale: "Biểu bì không phải tên con đường vận chuyển."}, {text: "con đường mạch gỗ và con đường mạch rây.", isCorrect: false, rationale: "Đây là hệ thống mạch vận chuyển dọc thân."}, {text: "con đường tế bào chất và con đường biểu bì.", isCorrect: false, rationale: "Sai tên con đường."}], hint: "Xuyên qua khoảng không gian giữa các tế bào hoặc qua màng/tế bào chất." },
            { id: 19, question: "Sau khi vào tế bào lông hút, nước vận chuyển một chiều vào mạch gỗ của rễ do cơ chế nào?", options: [{text: "Sự chênh lệch về áp suất thẩm thấu theo hướng tăng dần từ ngoài vào trong.", isCorrect: true, rationale: "Thế nước giảm dần (áp suất thẩm thấu tăng dần) từ lông hút vào trong giúp nước đi một chiều."}, {text: "Sự chênh lệch sức hút nước của tế bào theo hướng giảm dần từ ngoài vào trong.", isCorrect: false, rationale: "Sức hút nước phải tăng dần mới hút được nước vào sâu hơn."}, {text: "Sự chênh lệch thế nước theo hướng tăng dần từ ngoài vào trong.", isCorrect: false, rationale: "Nước đi từ thế nước cao đến thế nước thấp."}, {text: "Sự chênh lệch về áp suất thẩm thấu theo hướng giảm dần từ ngoài vào trong.", isCorrect: false, rationale: "Sai hướng."}], hint: "Hướng thay đổi áp suất thẩm thấu từ vỏ vào ruột." },
            { id: 20, question: "Khi nói về động lực của dòng mạch rây, phát biểu nào sau đây đúng?", options: [{text: "Do sự chênh lệch áp suất thẩm thấu giữa cơ quan nguồn và cơ quan chứa.", isCorrect: true, rationale: "Mạch rây dịch chuyển từ nơi áp suất thẩm thấu cao (nguồn) đến nơi thấp (chứa)."}, {text: "Nhờ sự kết hợp của 3 lực: lực đẩy, lực hút và lực liên kết.", isCorrect: false, rationale: "Đây là động lực dòng mạch gỗ."}, {text: "Nhờ quá trình quang hợp của thực vật.", isCorrect: false, rationale: "Quang hợp tạo sản phẩm nhưng không phải động lực trực tiếp."}, {text: "Thông qua hấp thụ nước ở rễ.", isCorrect: false, rationale: "Không phải động lực mạch rây."}], hint: "Chênh lệch nồng độ chất tan giữa lá (nguồn) và rễ/quả (chứa)." },
            { id: 21, question: "Khi tế bào khí khổng trương nước thì", options: [{text: "thành mỏng dãn nhanh hơn thành dày làm cho khí khổng mở ra, nước thoát ra.", isCorrect: true, rationale: "Thành mỏng dãn nhanh kéo thành dày cong theo làm mở khe khí khổng."}, {text: "thành mỏng dãn nhanh hơn thành dày làm cho khí khổng đóng lại.", isCorrect: false, rationale: "Trương nước làm mở khí khổng."}, {text: "thành dày dãn nhanh hơn thành mỏng làm cho khí khổng mở ra.", isCorrect: false, rationale: "Thành mỏng dãn nhanh hơn."}, {text: "thành dày dãn nhanh hơn thành mỏng làm cho khí khổng đóng lại.", isCorrect: false, rationale: "Sai cơ chế dãn."}], hint: "Đặc điểm cấu tạo thành mỏng và thành dày của tế bào hạt đậu." },
            { id: 22, question: "Cường độ ánh sáng tăng trong ngưỡng sinh lý có tác động", options: [{text: "tăng cường độ thoát hơi nước ở lá.", isCorrect: true, rationale: "Ánh sáng kích thích khí khổng mở và làm tăng nhiệt độ lá, thúc đẩy thoát hơi nước."}, {text: "giảm hấp thụ nước ở rễ.", isCorrect: false, rationale: "Thoát hơi nước tăng làm tăng hút nước ở rễ."}, {text: "giảm vận chuyển nước và dinh dưỡng trong cây.", isCorrect: false, rationale: "Vận chuyển tăng lên."}, {text: "giảm hấp thụ khoáng ở rễ.", isCorrect: false, rationale: "Tăng hấp thụ khoáng."}], hint: "Tác động của ánh sáng đến hoạt động khí khổng." },
            { id: 23, question: "Trong nguyên lý khuếch tán, các khoáng chất được vận chuyển từ nơi có", options: [{text: "nồng độ cao đến nơi nồng độ thấp, không tiêu tốn năng lượng.", isCorrect: true, rationale: "Khuếch tán là cơ chế thụ động theo gradient nồng độ."}, {text: "nồng độ cao đến nơi nồng độ thấp, cần tiêu tốn năng lượng.", isCorrect: false, rationale: "Không tiêu tốn ATP."}, {text: "nồng độ thấp đến nơi nồng độ cao, không tiêu tốn năng lượng.", isCorrect: false, rationale: "Trái quy luật khuếch tán."}, {text: "nồng độ thấp đến nơi nồng độ cao, tiêu tốn năng lượng.", isCorrect: false, rationale: "Đây là vận chuyển chủ động."}], hint: "Nguyên lý khuếch tán vật lý cơ bản." },
            { id: 24, question: "Khi tế bào mất nước sẽ có hiện tượng gì ở tế bào khí khổng?", options: [{text: "Thành mỏng hết căng ra làm cho thành dày duỗi thẳng, khí khổng đóng lại.", isCorrect: true, rationale: "Mất nước làm giảm sức căng thành mỏng, thành dày duỗi thẳng khép khe hở."}, {text: "Thành dày căng ra làm cho thành mỏng cong theo, khí khổng đóng lại.", isCorrect: false, rationale: "Khi mất nước các thành đều xẹp lại."}, {text: "Thành dày căng ra làm cho thành mỏng co lại, khí khổng đóng lại.", isCorrect: false, rationale: "Thành dày không căng khi mất nước."}, {text: "Thành mỏng căng ra làm cho thành dày duỗi thẳng, khí khổng khép lại.", isCorrect: false, rationale: "Sai logic."}], hint: "Sự thay đổi hình dạng tế bào hạt đậu khi mất sức căng trương nước." },
            { id: 25, question: "Cây trồng hấp thụ Nitrogen trong đất dưới dạng nào?", options: [{text: "$NO_3^-$ và $NH_4^+$.", isCorrect: true, rationale: "Cây chỉ hấp thụ nitrogen khoáng dạng nitrat ($NO_3^-$) và ammonium ($NH_4^+$)."}, {text: "$N_2$ và $NH_4^+$.", isCorrect: false, rationale: "Cây không trực tiếp hấp thụ được $N_2$ khí quyển."}, {text: "$NO_2$ và $NH_4^+$.", isCorrect: false, rationale: "$NO_2$ gây độc cho cây."}, {text: "$NO_2$ và $NO_3^-$.", isCorrect: false, rationale: "$NO_2$ không phải dạng hấp thụ chính."}], hint: "Hai dạng ion khoáng nitrogen trong dung dịch đất." },
            { id: 26, question: "Khi nói về quá trình chuyển hóa nitrogen, phát biểu nào KHÔNG đúng?", options: [{text: "Thực vật có khả năng hấp thụ nitrogen hữu cơ trong xác sinh vật.", isCorrect: true, rationale: "Phát biểu SAI vì thực vật chỉ hấp thụ nitrogen vô cơ ($NO_3^-$ và $NH_4^+$), nitrogen hữu cơ phải do vi khuẩn phân giải."}, {text: "Quá trình chuyển hóa $NO_3^-$ thành $N_2$ do vi sinh vật kị khí thực hiện.", isCorrect: false, rationale: "Phát biểu này đúng (vi khuẩn phản nitrat hóa)."}, {text: "Quá trình cố định nitrogen là quá trình $N_2$ liên kết với $H_2$ thành $NH_3$.", isCorrect: false, rationale: "Phát biểu này đúng."}, {text: "Nhờ enzyme nitrogenase vi sinh vật cố định nitrogen có khả năng chuyển $N_2$ thành $NH_3$.", isCorrect: false, rationale: "Phát biểu này đúng."}], hint: "Khả năng hấp thụ trực tiếp hợp chất hữu cơ đại phân tử của thực vật." },
            { id: 27, question: "Vai trò nào sau đây KHÔNG phải của nước?", options: [{text: "Cung cấp năng lượng cho các hoạt động của cây.", isCorrect: true, rationale: "Nước không phải là hợp chất chứa năng lượng để phân giải cấp ATP."}, {text: "Thành phần cấu tạo nên tế bào.", isCorrect: false, rationale: "Nước chiếm 70-90% khối lượng tế bào."}, {text: "Là môi trường sống của thực vật thủy sinh.", isCorrect: false, rationale: "Là vai trò môi trường ngoài."}, {text: "Là dung môi hòa tan muối khoáng và các chất hữu cơ trong cây.", isCorrect: false, rationale: "Là vai trò dung môi hòa tan."}], hint: "Nước có đóng vai trò là chất dinh dưỡng sinh năng lượng không?" },
            { id: 28, question: "Nồng độ oxygen trong đất ảnh hưởng đến quá trình hấp thụ ion khoáng của rễ cây chủ yếu vì oxygen cần thiết cho quá trình nào?", options: [{text: "Hô hấp tế bào tạo ATP.", isCorrect: true, rationale: "Hô hấp hiếu khí tạo ATP cung cấp cho sự hấp thụ khoáng chủ động."}, {text: "Nhân đôi DNA trong tế bào rễ.", isCorrect: false, rationale: "Không phải nguyên nhân trực tiếp thúc đẩy hút khoáng."}, {text: "Phiên mã các gene trong tế bào rễ.", isCorrect: false, rationale: "Không liên quan trực tiếp năng lượng hút khoáng."}, {text: "Tổng hợp cellulose ở thành tế bào.", isCorrect: false, rationale: "Không quyết định lực hút khoáng."}], hint: "Quá trình sinh năng lượng ATP trong tế bào rễ." },
            { id: 29, question: "Động lực nào dưới đây đóng vai trò chủ yếu giúp cây cao vài chục mét vẫn hút và vận chuyển nước, ion khoáng từ rễ lên lá?", options: [{text: "Lực hút do thoát hơi nước ở lá.", isCorrect: true, rationale: "Lực hút do thoát hơi nước ở lá là động lực đầu trên mạnh nhất."}, {text: "Lực đẩy của rễ (Áp suất rễ).", isCorrect: false, rationale: "Áp suất rễ chỉ đẩy nước lên được tầm vài mét."}, {text: "Lực liên kết giữa các phân tử nước với nhau.", isCorrect: false, rationale: "Là động lực trung gian duy trì cột nước."}, {text: "Lực liên kết giữa các phân tử nước với thành mạch gỗ.", isCorrect: false, rationale: "Giữ cột nước không bị ngắt quãng."}], hint: "Động lực đầu trên tạo lực kéo lớn nhất." },
            { id: 30, question: "Con đường thoát hơi nước qua khí khổng có đặc điểm là", options: [{text: "vận tốc lớn, được điều chỉnh bằng việc đóng, mở khí khổng.", isCorrect: true, rationale: "Khí khổng có thể đóng mở linh hoạt nên vận tốc thoát hơi nước lớn và được điều tiết."}, {text: "vận tốc nhỏ, được điều chỉnh bằng việc đóng, mở khí khổng.", isCorrect: false, rationale: "Vận tốc thoát hơi nước qua khí khổng rất lớn."}, {text: "vận tốc lớn, không được điều chỉnh bằng việc đóng, mở khí khổng.", isCorrect: false, rationale: "Có được điều chỉnh."}, {text: "vận tốc nhỏ, không được điều chỉnh.", isCorrect: false, rationale: "Đây là đặc điểm con đường qua cutin."}], hint: "Vận tốc thoát hơi nước và khả năng chủ động điều tiết." },
            { id: 31, question: "Khi rễ cây bị ngập úng lâu ngày, cây bị héo. Có bao nhiêu giải thích đúng?\nI. Đất ngập úng thiếu $O_2$, rễ không hô hấp được.\nII. Rễ thiếu $O_2$ dẫn đến lông hút chết, rễ thối không hút được nước.\nIII. Nước quá nhiều rễ không hấp thu hết.\nIV. Vi sinh vật kị khí gây thối rễ.", options: [{text: "3.", isCorrect: true, rationale: "Các ý I, II, IV đúng. Ý III sai vì cây héo không phải do không hấp thu hết mà do bộ rễ bị hủy hoại không hút được nước."}, {text: "1.", isCorrect: false, rationale: "Sai số lượng."}, {text: "2.", isCorrect: false, rationale: "Sai số lượng."}, {text: "4.", isCorrect: false, rationale: "Sai số lượng."}], hint: "Tình trạng thiếu oxy ảnh hưởng đến hô hấp tế bào rễ." },
            { id: 32, question: "Vào ngày nắng nóng khô hanh, cây thoát hơi nước mạnh hơn ngày mát độ ẩm cao vì", options: [{text: "Nhiệt độ cao thúc đẩy sự bay hơi nước, độ ẩm thấp làm tăng chênh lệch hơi nước giữa lá và không khí.", isCorrect: true, rationale: "Giải thích chính xác theo nguyên lý nhiệt động và khuếch tán."}, {text: "Nhiệt độ cao làm giảm sự bay hơi nước.", isCorrect: false, rationale: "Sai nhiệt độ làm tăng bay hơi."}, {text: "Nhiệt độ cao làm tăng hấp thụ nước ở rễ.", isCorrect: false, rationale: "Không phải nguyên nhân trực tiếp làm tăng thoát hơi nước ở lá."}, {text: "Nhiệt độ cao làm khí khổng luôn đóng lại.", isCorrect: false, rationale: "Sai ban đầu khí khổng sẽ mở rộng."}], hint: "Tác động kép của nhiệt độ môi trường và độ ẩm không khí." },
            { id: 33, question: "Khi khô hạn, thực vật đóng khí khổng và phát triển rễ ăn sâu nhằm", options: [{text: "Giảm mất nước qua lá và tăng khả năng tiếp cận nguồn nước trong đất.", isCorrect: true, rationale: "Đóng khí khổng hạn chế thoát nước, rễ sâu để tìm nguồn nước ngầm."}, {text: "Tăng cường thoát hơi nước để làm mát lá.", isCorrect: false, rationale: "Khô hạn đóng khí khổng sẽ làm giảm thoát hơi nước."}, {text: "Tăng hấp thụ oxygen qua lá.", isCorrect: false, rationale: "Đóng khí khổng làm giảm trao đổi khí."}, {text: "Tăng vận chuyển đường từ lá xuống rễ.", isCorrect: false, rationale: "Không phải mục đích thích nghi khô hạn."}], hint: "Sự kết hợp giữa tiết kiệm nước và tìm kiếm nguồn nước." },
            { id: 34, question: "Lúa có khả năng hình thành nhiều mô khí trong rễ và thân khi bị ngập nước giúp cây", options: [{text: "Tăng khả năng vận chuyển oxygen từ các bộ phận trên mặt nước đến các mô bên dưới.", isCorrect: true, rationale: "Mô khí là hệ thống kênh dẫn $O_2$ từ không khí xuống rễ ngập nước."}, {text: "Tăng khả năng hấp thụ nước trực tiếp qua lá ngập dưới nước.", isCorrect: false, rationale: "Mô khí phục vụ dẫn khí $O_2$."}, {text: "Tăng cường thoát hơi nước để kéo oxygen từ đất vào rễ.", isCorrect: false, rationale: "Sai cơ chế."}, {text: "Hạn chế hoàn toàn quá trình hô hấp của tế bào rễ.", isCorrect: false, rationale: "Rễ vẫn cần hô hấp hiếu khí."}], hint: "Vai trò thông khí của mô khí ở thực vật thủy sinh/chịu ngập." },
            { id: 35, question: "Bón phân gấp đôi nhu cầu làm cây bị cháy mép lá và sinh trưởng kém vì", options: [{text: "Bón phân vượt nhu cầu gây mất cân đối dinh dưỡng, tăng áp suất thẩm thấu dung dịch đất và gây độc.", isCorrect: true, rationale: "Nồng độ phân bón cao làm thế nước trong đất giảm thấp hơn tế bào rễ, làm rễ bị mất nước."}, {text: "Lượng phân càng lớn năng suất càng cao.", isCorrect: false, rationale: "Sai quy luật năng suất giảm dần."}, {text: "Phân bón chỉ cung cấp năng lượng.", isCorrect: false, rationale: "Phân bón cung cấp nguyên tố khoáng."}, {text: "Cây chỉ hấp thụ phân bón khi đất hoàn toàn khô.", isCorrect: false, rationale: "Cây chỉ hấp thụ phân bón hòa tan trong nước."}], hint: "Hiện tượng ưu trương của dung dịch đất khi bón quá nhiều phân." },
            { id: 36, question: "Ruộng ngô thiếu Nitrogen kéo dài sinh trưởng kém và năng suất thấp vì", options: [{text: "Thiếu nitrogen làm giảm tổng hợp amino acid và protein, hạn chế sinh trưởng và tích lũy chất hữu cơ.", isCorrect: true, rationale: "Nitrogen là thành phần bắt buộc của protein, nucleic acid, chlorophyll."}, {text: "Thiếu nitrogen làm tăng tổng hợp diệp lục.", isCorrect: false, rationale: "Thiếu N lá sẽ bị vàng do thiếu diệp lục."}, {text: "Thiếu nitrogen làm tăng hấp thụ phosphorus.", isCorrect: false, rationale: "Không gây đình trệ hoàn toàn theo cơ chế này."}, {text: "Thiếu nitrogen làm tăng phân chia tế bào ở rễ.", isCorrect: false, rationale: "Thiếu N hạn chế phân chia tế bào."}], hint: "Nitrogen là thành phần cấu tạo của hợp chất sinh học nào?" },
            { id: 37, question: "Cây chịu mặn (Sú, Vẹt, Đước) lấy được nước trong đất mặn do", options: [{text: "Do không bào của tế bào lông hút có áp suất thẩm thấu lớn hơn cả nồng độ dung dịch đất mặn.", isCorrect: true, rationale: "Cây tích lũy nồng độ chất tan rất cao trong không bào để duy trì áp suất thẩm thấu cao hơn môi trường."}, {text: "Do các loài này có bộ phận đặc biệt ở rễ.", isCorrect: false, rationale: "Không giải thích bản chất thẩm thấu."}, {text: "Do màng tế bào rễ có cấu trúc đặc biệt.", isCorrect: false, rationale: "Không giải thích bản chất thế nước."}, {text: "Do tính thấm chọn lọc.", isCorrect: false, rationale: "Chưa nêu nguyên nhân động lực hút nước."}], hint: "So sánh áp suất thẩm thấu giữa rễ cây mặn và dung dịch đất mặn." },
            { id: 38, question: "Phát biểu nào sau đây ĐÚNG về quang hợp?", options: [{text: "Một trong các sản phẩm của quang hợp là khí $O_2$.", isCorrect: true, rationale: "Phương trình tổng quát: $6CO_2 + 6H_2O \\rightarrow C_6H_{12}O_6 + 6O_2$."}, {text: "Trong quá trình quang hợp, cây hấp thụ $O_2$ để tổng hợp chất hữu cơ.", isCorrect: false, rationale: "Cây hấp thụ $CO_2$."}, {text: "Quang hợp là quá trình sinh vật sử dụng ánh sáng để phân giải chất hữu cơ.", isCorrect: false, rationale: "Quang hợp là quá trình tổng hợp chất hữu cơ."}, {text: "Quang hợp xảy ra trong cơ thể mọi sinh vật.", isCorrect: false, rationale: "Chỉ xảy ra ở sinh vật tự dưỡng quang hợp."}], hint: "Sản phẩm khí thoát ra trong quá trình pha sáng." },
            { id: 39, question: "Thực vật $C_3$ cố định $CO_2$ theo chu trình", options: [{text: "Calvin.", isCorrect: true, rationale: "Thực vật $C_3$ cố định $CO_2$ duy nhất qua chu trình Calvin ($C_3$)."}, {text: "PEP.", isCorrect: false, rationale: "PEP là chất nhận đầu tiên ở $C_4$ và CAM."}, {text: "C4.", isCorrect: false, rationale: "Dành cho thực vật $C_4$."}, {text: "Chuỗi truyền electron.", isCorrect: false, rationale: "Là giai đoạn tổng hợp ATP/NADPH."}], hint: "Chu trình cố định carbon phổ biến nhất ở thực vật." },
            { id: 40, question: "Sản phẩm nào của pha sáng KHÔNG sử dụng cho pha tối trong quang hợp?", options: [{text: "$O_2$.", isCorrect: true, rationale: "$O_2$ được giải phóng ra khí quyển, ATP và NADPH mới được đưa vào pha tối."}, {text: "ATP.", isCorrect: false, rationale: "ATP cung cấp năng lượng cho pha tối."}, {text: "NADPH.", isCorrect: false, rationale: "NADPH cung cấp khử cho pha tối."}, {text: "$CO_2$.", isCorrect: false, rationale: "$CO_2$ là nguyên liệu pha tối, không phải sản phẩm pha sáng."}], hint: "Sản phẩm khí bay ra môi trường từ quá trình quang phân phân tử nước." },
            { id: 41, question: "Trong chu trình Calvin, sản phẩm pha sáng (ATP) được sử dụng ở giai đoạn nào?", options: [{text: "Khử 3-phosphoglycerate và tái tạo RuBP.", isCorrect: true, rationale: "ATP được sử dụng ở cả giai đoạn khử 3-PGA thành G3P và giai đoạn tái tạo chất nhận RuBP."}, {text: "Cố định $CO_2$.", isCorrect: false, rationale: "Giai đoạn này không tốn ATP."}, {text: "Khử 3-phosphoglycerate.", isCorrect: false, rationale: "Chưa đủ."}, {text: "Tái tạo RuBP.", isCorrect: false, rationale: "Chưa đủ."}], hint: "Các giai đoạn tiêu tốn năng lượng ATP trong chu trình Calvin." },
            { id: 42, question: "Trong pha tối của thực vật $C_4$, chu trình Calvin diễn ra ở loại tế bào nào?", options: [{text: "Tế bào bao bó mạch.", isCorrect: true, rationale: "Ở thực vật $C_4$, chu trình Calvin diễn ra tại tế bào bao bó mạch, còn giai đoạn cố định $CO_2$ tạm thời ở tế bào thịt lá."}, {text: "Tế bào thịt lá (mô giậu).", isCorrect: false, rationale: "Nơi diễn ra chu trình $C_4$ ban đầu."}, {text: "Mô dẫn.", isCorrect: false, rationale: "Vận chuyển nước và chất dinh dưỡng."}, {text: "Biểu bì lá.", isCorrect: false, rationale: "Bảo vệ bề mặt."}], hint: "Vị trí không gian xảy ra chu trình Calvin ở cây C4." },
            { id: 43, question: "Phát biểu nào sau đây đúng khi so sánh điểm bù $CO_2$ giữa thực vật $C_3$ và $C_4$?", options: [{text: "Thực vật $C_4$ có điểm bù $CO_2$ thấp hơn $C_3$ dẫn đến cường độ quang hợp cao hơn trong điều kiện ít $CO_2$.", isCorrect: true, rationale: "Thực vật $C_4$ có bơm $CO_2$ hoạt động hiệu quả nên điểm bù $CO_2$ rất thấp (0-10 ppm) so với $C_3$ (30-70 ppm)."}, {text: "Thực vật $C_3$ có điểm bù $CO_2$ thấp hơn $C_4$.", isCorrect: false, rationale: "Thực vật $C_3$ có điểm bù cao hơn."}, {text: "Khi tăng $CO_2$ cường độ quang hợp luôn tăng tỉ lệ thuận không giới hạn.", isCorrect: false, rationale: "Sẽ bị bão hòa."}, {text: "Điểm bão hòa $CO_2$ của $C_4$ cao hơn $C_3$.", isCorrect: false, rationale: "Điểm bão hòa của $C_4$ thường thấp hơn $C_3$."}], hint: "Khả năng tận dụng $CO_2$ nồng độ thấp ở nhóm thực vật C4." },
            { id: 44, question: "Phát biểu nào CHƯA ĐÚNG khi nói về ảnh hưởng nồng độ $CO_2$ ở $C_3$ và $C_4$?", options: [{text: "Ở thực vật $C_4$ có điểm bù $CO_2$ và điểm bão hòa $CO_2$ cao hơn thực vật $C_3$.", isCorrect: true, rationale: "Phát biểu này SAI vì $C_4$ có điểm bù $CO_2$ THẤP HƠN thực vật $C_3$."}, {text: "Điểm bù $CO_2$ là nồng độ $CO_2$ tại đó cường độ quang hợp bằng cường độ hô hấp.", isCorrect: false, rationale: "Phát biểu này đúng định nghĩa."}, {text: "Điểm bão hòa $CO_2$ là nồng độ mà tại đó quang hợp đạt cực đại.", isCorrect: false, rationale: "Phát biểu này đúng."}, {text: "Ở nồng độ $CO_2$ thấp, năng suất quang hợp $C_4$ thường cao hơn $C_3$.", isCorrect: false, rationale: "Phát biểu này đúng."}], hint: "Điểm bù CO2 của C4 thấp hay cao hơn C3?" },
            { id: 45, question: "Mối quan hệ giữa điểm bù $CO_2$ của $C_3$ và $C_4$:", options: [{text: "Điểm bù $CO_2$ ở thực vật $C_4$ thấp hơn $C_3$.", isCorrect: true, rationale: "Do enzyme PEP carboxylase có ái lực cực cao với $CO_2$."}, {text: "Điểm bù $CO_2$ ở thực vật $C_4$ cao hơn $C_3$.", isCorrect: false, rationale: "Sai."}, {text: "Vị trí điểm bù $CO_2$ của hai nhóm hoàn toàn bằng nhau.", isCorrect: false, rationale: "Khác biệt rõ rệt."}, {text: "Thực vật $C_3$ không có điểm bù $CO_2$.", isCorrect: false, rationale: "Cả 2 nhóm đều có điểm bù."}], hint: "So sánh ái lực gắn CO2 của PEP carboxylase và RuBisCO." },
            { id: 46, question: "Phát biểu nào ĐÚNG về mối quan hệ giữa quang hợp và năng suất cây trồng?", options: [{text: "Sản phẩm quang hợp đóng góp khoảng 90 – 95% tổng lượng chất khô tích lũy trong cây.", isCorrect: true, rationale: "Quang hợp quyết định 90-95% năng suất sinh học của cây trồng."}, {text: "Năng suất chỉ phụ thuộc diện tích lá.", isCorrect: false, rationale: "Còn phụ thuộc cường độ quang hợp và hiệu suất cố định carbon."}, {text: "Năng suất kinh tế luôn bằng tổng sinh khối.", isCorrect: false, rationale: "Năng suất kinh tế chỉ là một phần sinh khối được thu hoạch."}, {text: "Cường độ quang hợp cao thì năng suất kinh tế mọi loài cây đều đạt tối đa như nhau.", isCorrect: false, rationale: "Tùy thuộc bộ phận thu hoạch và đặc tính loài."}], hint: "Tỷ lệ chất khô trong cây có nguồn gốc từ sản phẩm quang hợp." },
            { id: 47, question: "Để nâng cao hiệu quả cố định $CO_2$ nhằm tăng năng suất, hướng nghiên cứu phù hợp nhất là", options: [{text: "Cải biến enzyme RuDP carboxylase (RuBisCO) nhằm làm tăng ái lực của nó với $CO_2$.", isCorrect: true, rationale: "RuBisCO dễ bị oxy hóa gây hô hấp sáng, cải biến nó giúp tăng hiệu suất cố định $CO_2$."}, {text: "Dùng kỹ thuật di truyền làm cây giảm hô hấp.", isCorrect: false, rationale: "Hô hấp tế bào vẫn cần thiết để tạo năng lượng."}, {text: "Sử dụng đường glucose làm nguồn cung cấp carbon qua rễ.", isCorrect: false, rationale: "Không khả thi và tốn kém lớn."}, {text: "Tăng cường chiếu sáng ban đêm đại trà.", isCorrect: false, rationale: "Tốn kém năng lượng."}], hint: "Tối ưu hóa enzyme then chốt của pha tối." },
            { id: 48, question: "Trồng hai cây A và B trong nhà kính, khi tăng ánh sáng và nhiệt độ thì quang hợp cây A giảm, cây B tăng. Thí nghiệm nhằm", options: [{text: "nhận biết cây $C_3$ và cây $C_4$.", isCorrect: true, rationale: "Cây $C_3$ (cây A) bị giảm quang hợp do hô hấp sáng ở nhiệt độ/ánh sáng cao; Cây $C_4$ (cây B) tăng quang hợp vì chịu nhiệt/ánh sáng tốt."}, {text: "đo cường độ quang hợp ở 2 cây A và B.", isCorrect: false, rationale: "Đây chỉ là phương pháp, mục đích chính là phân loại."}, {text: "nhận biết cây $C_4$ và CAM.", isCorrect: false, rationale: "Cây CAM mở khí khổng ban đêm không phù hợp thí nghiệm này."}, {text: "vì một mục đích khác.", isCorrect: false, rationale: "Sai."}], hint: "Sự phản ứng khác nhau của nhóm C3 và C4 với nhiệt độ và ánh sáng cao." },
            { id: 49, question: "Lợi ích nào đúng nhất khi dùng đèn LED đỏ chiếu sáng trong nhà kính trồng rau?", options: [{text: "Kiểm soát được nhiệt độ, độ ẩm, dinh dưỡng và tối ưu vùng phổ hấp thụ diệp lục cho năng suất cao.", isCorrect: true, rationale: "Ánh sáng đỏ nằm đúng vùng hấp thụ mạnh của diệp lục thúc đẩy quang hợp tổng hợp carbohydrate."}, {text: "Đèn LED đỏ có năng lượng cao hơn tất cả các tia sáng khác.", isCorrect: false, rationale: "Tia xanh tím có photon năng lượng cao hơn."}, {text: "Không bao giờ cần bón phân.", isCorrect: false, rationale: "Vẫn cần dinh dưỡng khoáng."}, {text: "Tránh tuyệt đối hiện tượng hô hấp.", isCorrect: false, rationale: "Hô hấp vẫn diễn ra bình thường."}], hint: "Phổ hấp thụ của diệp lục đối với dải ánh sáng đỏ." },
            { id: 50, question: "Tinh bột tích lũy mạnh nhất trong lá khoảng 6h - 9h sáng vì", options: [{text: "Vào buổi sáng, khí khổng mở rộng, nhiệt độ và ánh sáng thuận lợi làm tăng quang hợp.", isCorrect: true, rationale: "Khí khổng mở sau đêm giúp $CO_2$ đi vào mạnh kết hợp ánh sáng buổi sáng tối ưu cho quang hợp."}, {text: "Tinh bột chỉ tổng hợp ở nhiệt độ rất thấp.", isCorrect: false, rationale: "Nhiệt độ quá thấp làm giảm hoạt tính enzyme."}, {text: "Nhiệt độ buổi sáng làm biến tính enzyme hô hấp.", isCorrect: false, rationale: "Nhiệt độ buổi sáng ôn hòa."}, {text: "Ánh sáng sáng sớm chỉ có tia hồng ngoại.", isCorrect: false, rationale: "Ánh sáng mặt trời đầy đủ quang phổ."}], hint: "Trạng thái mở khí khổng và cường độ ánh sáng ban sáng." },
            { id: 51, question: "Rau trong siêu thị được bảo quản trong túi nylon đục lỗ để trong tủ mát nhằm", options: [{text: "giảm sự mất nước và hạ thấp cường độ hô hấp giữ rau tươi lâu.", isCorrect: true, rationale: "Tủ mát hạ nhiệt độ giảm hô hấp; túi đục lỗ đọng ẩm vừa phải chống héo và tránh úng đọng nước."}, {text: "tăng quá trình hô hấp của rau.", isCorrect: false, rationale: "Tăng hô hấp làm tiêu hao nhanh chất hữu cơ."}, {text: "tăng sự thoát hơi nước.", isCorrect: false, rationale: "Tăng thoát hơi nước làm rau héo nhanh."}, {text: "diệt toàn bộ vi khuẩn.", isCorrect: false, rationale: "Nhiệt độ mát chỉ ức chế chứ không diệt khuẩn hoàn toàn."}], hint: "Mục đích kiểm soát nhiệt độ và độ ẩm đối với hô hấp." },
            { id: 52, question: "Ban đêm trong nhà kính kín gió nồng độ $CO_2$ tăng cao chủ yếu do", options: [{text: "thực vật ban đêm chỉ hô hấp, thải $CO_2$.", isCorrect: true, rationale: "Ban đêm không có ánh sáng nên quang hợp dừng, thực vật chỉ hô hấp thải $CO_2$."}, {text: "thực vật ban đêm chỉ quang hợp.", isCorrect: false, rationale: "Sai, quang hợp cần ánh sáng."}, {text: "hô hấp ban đêm mạnh hơn ban ngày gấp nhiều lần.", isCorrect: false, rationale: "Do không có quang hợp tiêu thụ $CO_2$ bù lại."}, {text: "quang hợp và hô hấp đều dừng lại.", isCorrect: false, rationale: "Hô hấp diễn ra liên tục 24/7."}], hint: "Sự có/không của ánh sáng tác động đến quang hợp ban đêm." },
            { id: 53, question: "Mắm, Đước sống được ở môi trường đất ngập nước/bãi bồi ven biển nhờ", options: [{text: "có hệ rễ khí sinh (rễ thở) nhô khỏi mặt nước để lấy $O_2$ từ không khí.", isCorrect: true, rationale: "Rễ thở/rễ khí sinh giúp cây hấp thụ $O_2$ trực tiếp cho hô hấp rễ."}, {text: "mạng lưới mô khí thông từ lá đến rễ.", isCorrect: false, rationale: "Đước/Mắm phát triển mạnh hệ rễ thở nhô lên mặt bùn."}, {text: "không cần hô hấp ở rễ.", isCorrect: false, rationale: "Rễ cây nào cũng cần hô hấp."}, {text: "hô hấp qua vỏ hạt.", isCorrect: false, rationale: "Không đúng."}], hint: "Thế năng hình thái đặc trưng nhô lên khỏi mặt bùn của cây vùng ngập mặn." },
            { id: 54, question: "Bảo quản rau xanh trong ngăn mát tủ lạnh vì", options: [{text: "nhiệt độ thấp làm giảm hoạt tính các enzyme hô hấp, giảm tiêu hao chất khô.", isCorrect: true, rationale: "Nhiệt độ thấp làm chậm các phản ứng enzymatic trong quá trình hô hấp."}, {text: "trong tủ thiếu ánh sáng nên hô hấp ngừng hẳn.", isCorrect: false, rationale: "Hô hấp không phụ thuộc trực tiếp vào ánh sáng."}, {text: "nhiệt độ thấp làm biến tính hoàn toàn enzyme.", isCorrect: false, rationale: "Nhiệt độ mát chỉ làm giảm hoạt tính chứ không biến tính."}, {text: "nhiệt độ ảnh hưởng làm khí khổng mở to.", isCorrect: false, rationale: "Nhiệt độ thấp làm giảm mở khí khổng."}], hint: "Ảnh hưởng của nhiệt độ đến hoạt tính enzyme." },
            { id: 55, question: "Về phổ hấp thụ hệ sắc tố: Diệp lục b hấp thụ dải xanh tím nhiều hơn dải đỏ. Đúng hay Sai?", options: [{text: "Đúng", isCorrect: true, rationale: "Chlorophyll b có đỉnh hấp thụ ở vùng xanh tím cao hơn đỉnh ở vùng đỏ."}, {text: "Sai", isCorrect: false, rationale: "Đây là đặc tính quang phổ chính xác của diệp lục b."}], hint: "Đỉnh hấp thụ của diệp lục b trên biểu đồ quang phổ." },
            { id: 56, question: "Trong thí nghiệm chứng minh sự hình thành tinh bột: Phần lá không bị che giấy đen tác dụng với iodine cho màu xanh tím. Đúng hay Sai?", options: [{text: "Đúng", isCorrect: true, rationale: "Phần chiếu sáng quang hợp tạo tinh bột, tinh bột phản ứng với iodine cho màu xanh tím đặc trưng."}, {text: "Sai", isCorrect: false, rationale: "Nhận định này hoàn toàn đúng."}], hint: "Thuốc thử iodine nhận biết chất nào?" },
            { id: 57, question: "Cỏ Sorghum ($C_4$) có hiệu quả sử dụng nước kém hơn đậu tương ($C_3$). Đúng hay Sai?", options: [{text: "Sai", isCorrect: true, rationale: "Thực vật $C_4$ (cỏ Sorghum) có hiệu quả sử dụng nước CAO HƠN thực vật $C_3$ (đậu tương)."}, {text: "Đúng", isCorrect: false, rationale: "C4 tiết kiệm nước tốt hơn C3."}], hint: "So sánh khả năng tiết kiệm nước giữa C3 và C4." },
            { id: 58, question: "Tốc độ quang hợp giảm ở nhiệt độ $>40^\circ C$ do enzyme bị biến tính. Đúng hay Sai?", options: [{text: "Đúng", isCorrect: true, rationale: "Nhiệt độ cao phá hủy cấu trúc không gian 3 chiều của enzyme quang hợp."}, {text: "Sai", isCorrect: false, rationale: "Đúng theo lý thuyết sinh hóa."}], hint: "Tác động của nhiệt độ quá cao đến bản chất protein của enzyme." },
            { id: 59, question: "Thực vật CAM đóng khí khổng ban ngày để tránh mất nước, mở ban đêm để lấy $CO_2$. Đúng hay Sai?", options: [{text: "Đúng", isCorrect: true, rationale: "Đây là cơ chế thích nghi đặc trưng của thực vật sa mạc/mọng nước."}, {text: "Sai", isCorrect: false, rationale: "Nhận định này hoàn toàn đúng."}], hint: "Nhịp điệu đóng mở khí khổng ngược ở cây CAM." },
            { id: 60, question: "Hợp chất cố định $CO_2$ đầu tiên của giai đoạn pha tối ở thực vật $C_3$ là 3-PGA (3C). Đúng hay Sai?", options: [{text: "Đúng", isCorrect: true, rationale: "$CO_2$ kết hợp với RuBP tạo ra 2 phân tử 3-PGA (3 carbon)."}, {text: "Sai", isCorrect: false, rationale: "Đúng theo chu trình Calvin."}], hint: "Tên gọi $C_3$ xuất phát từ số carbon của sản phẩm cố định đầu tiên." },
            { id: 61, question: "Có bao nhiêu dấu hiệu đặc trưng của quá trình trao đổi chất và chuyển hóa năng lượng ở sinh vật: (1) Thu nhận các chất; (2) Biến đổi & chuyển hóa; (3) Đào thải; (4) Vận chuyển; (5) Điều hòa?", options: [{text: "5.", isCorrect: true, rationale: "Cả 5 đặc điểm nêu trên đều là các dấu hiệu đặc trưng của quá trình trao đổi chất."}, {text: "4.", isCorrect: false, rationale: "Thiếu 1 ý."}, {text: "3.", isCorrect: false, rationale: "Thiếu 2 ý."}, {text: "2.", isCorrect: false, rationale: "Thiếu 3 ý."}], hint: "Tất cả các khâu từ thu nhận, biến đổi đến thải bỏ và điều hòa." },
            { id: 62, question: "Thứ tự đúng các giai đoạn chuyển hóa năng lượng trong sinh giới là:", options: [{text: "Tổng hợp $\\rightarrow$ Phân giải $\\rightarrow$ Huy động năng lượng.", isCorrect: true, rationale: "Năng lượng ánh sáng được tổng hợp thành năng lượng hóa học $\\rightarrow$ phân giải tạo ATP $\\rightarrow$ huy động cho hoạt động sống."}, {text: "Phân giải $\\rightarrow$ Tổng hợp $\\rightarrow$ Huy động năng lượng.", isCorrect: false, rationale: "Sai thứ tự."}, {text: "Huy động năng lượng $\\rightarrow$ Tổng hợp $\\rightarrow$ Phân giải.", isCorrect: false, rationale: "Sai thứ tự."}, {text: "Tổng hợp $\\rightarrow$ Huy động năng lượng $\\rightarrow$ Phân giải.", isCorrect: false, rationale: "Sai thứ tự."}], hint: "Từ tích lũy năng lượng đến giải phóng ATP và sử dụng." },
            { id: 63, question: "Có bao nhiêu sinh vật tự dưỡng trong các loài: (1) Thực vật; (2) Trùng roi xanh; (3) Vi khuẩn hóa tổng hợp; (4) Vi khuẩn lam?", options: [{text: "4.", isCorrect: true, rationale: "Cả 4 sinh vật trên đều có khả năng tự dưỡng (quang tự dưỡng hoặc hóa tự dưỡng)."}, {text: "3.", isCorrect: false, rationale: "Sơ suất bỏ qua trùng roi xanh hoặc vi khuẩn."}, {text: "2.", isCorrect: false, rationale: "Thiếu."}, {text: "1.", isCorrect: false, rationale: "Thiếu."}], hint: "Kiểm tra khả năng tự tổng hợp chất hữu cơ của từng nhóm." },
            { id: 64, question: "Thực vật và động vật đều có bao nhiêu quá trình chung về trao đổi chất: (1) Tiếp nhận/vận chuyển; (2) Biến đổi; (3) Thải chất; (4) Điều hòa?", options: [{text: "4.", isCorrect: true, rationale: "Mọi sinh vật đa bào đều có đầy đủ 4 quá trình chung này."}, {text: "3.", isCorrect: false, rationale: "Sai."}, {text: "2.", isCorrect: false, rationale: "Sai."}, {text: "1.", isCorrect: false, rationale: "Sai."}], hint: "Các nguyên lý sinh học chung cho mọi sinh vật." },
            { id: 65, question: "Trong các bước thực hành thí nghiệm chứng minh sự vận chuyển nước trong thân, có bao nhiêu bước ĐÚNG?", options: [{text: "3.", isCorrect: true, rationale: "Các bước (2), (3), (4) nằm trong quy trình chuẩn bị và quan sát thí nghiệm hút/vận chuyển nước."}, {text: "2.", isCorrect: false, rationale: "Sai."}, {text: "4.", isCorrect: false, rationale: "Có bước bị sai thao tác."}, {text: "1.", isCorrect: false, rationale: "Sai."}], hint: "Thao tác cắm hoa màu và quan sát mạch gỗ." },
            { id: 66, question: "Số nội dung ĐÚNG về các bước thực hành quan sát khí khổng ở lá thài lài tía:", options: [{text: "3.", isCorrect: true, rationale: "Các bước (1), (2), (3) đúng quy trình làm tiêu bản hiển vi soi khí khổng."}, {text: "4.", isCorrect: false, rationale: "Bước (4) không thuộc quy trình quan sát tế bào khí khổng dưới kính hiển vi."}, {text: "2.", isCorrect: false, rationale: "Sai."}, {text: "1.", isCorrect: false, rationale: "Sai."}], hint: "Quy trình bóc biểu bì, nhỏ nước và soi kính hiển vi." },
            { id: 67, question: "Phân tích bảng số lượng khí khổng, có bao nhiêu nhận định SAI? (Nhận định 3: Sự phân bố khí khổng không liên quan môi trường sống)", options: [{text: "1.", isCorrect: true, rationale: "Chỉ có nhận định (3) là SAI vì sự phân bố khí khổng liên quan chặt chẽ đến sự thích nghi với môi trường sống."}, {text: "2.", isCorrect: false, rationale: "Sai."}, {text: "3.", isCorrect: false, rationale: "Sai."}, {text: "4.", isCorrect: false, rationale: "Sai."}], hint: "Khí khổng có liên quan đến sự thích nghi sinh thái không?" },
            { id: 68, question: "Thí nghiệm chứng minh thoát hơi nước qua lá bằng cách trùm túi nilon trong suốt lên chậu cây có lá và chậu không có lá. Kết quả là", options: [{text: "Túi nilon ở chậu có lá bị mờ đi do đọng các giọt nước.", isCorrect: true, rationale: "Hơi nước thoát ra từ lá gặp thành túi nilon ngưng tụ thành giọt nước."}, {text: "Túi nilon ở chậu không lá đọng nhiều nước hơn.", isCorrect: false, rationale: "Không có lá không thoát hơi nước."}, {text: "Cả hai túi đều hoàn toàn khô ráo.", isCorrect: false, rationale: "Sai."}, {text: "Túi nilon bị phồng to chứa đầy khí $CO_2$.", isCorrect: false, rationale: "Hiện tượng quan sát được là giọt nước ngưng tụ."}], hint: "Hiện tượng ngưng tụ hơi nước trên thành túi nilon." },
            { id: 69, question: "Thí nghiệm cắm cành hoa trắng vào dung dịch nước màu chứng minh", options: [{text: "Sự vận chuyển nước và chất tan trong mạch gỗ của thân.", isCorrect: true, rationale: "Nước màu theo mạch gỗ đi lên làm cánh hoa trắng đổi màu."}, {text: "Sự thoát hơi nước ở lá.", isCorrect: false, rationale: "Thí nghiệm này tập trung vào dòng vận chuyển."}, {text: "Quá trình quang hợp.", isCorrect: false, rationale: "Không chứng minh quang hợp."}, {text: "Sự hô hấp của hoa.", isCorrect: false, rationale: "Không chứng minh hô hấp."}], hint: "Màu sắc cánh hoa thay đổi do dung dịch màu đi qua mạch nào?" },
            { id: 70, question: "Kết quả thí nghiệm nha đam cho thấy khi độ ẩm đất giảm từ 16% xuống 1.3%, tốc độ thoát hơi nước giảm từ 0.095 xuống 0.033. Có bao nhiêu nhận định CHƯA ĐÚNG?", options: [{text: "2.", isCorrect: true, rationale: "Nhận định 1 (không liên quan) và 3 (độ ẩm không khí) là chưa đúng theo dữ liệu bài cho."}, {text: "1.", isCorrect: false, rationale: "Sai."}, {text: "3.", isCorrect: false, rationale: "Sai."}, {text: "4.", isCorrect: false, rationale: "Sai."}], hint: "Đối chiếu mối tương quan giữa độ ẩm đất và tốc độ thoát hơi nước." },
            { id: 71, question: "Khả năng hấp thụ nước của dâu tây theo nhiệt độ: $8^\circ C$ ($20mL$), $18^\circ C$ ($45mL$), $23^\circ C$ ($52.8mL$). Nhận định ĐÚNG là:", options: [{text: "Ở $23^\circ C$, lượng nước hấp thụ cao gấp 2,64 lần so với $8^\circ C$.", isCorrect: true, rationale: "Phép tính: $52.8 / 20 = 2.64$ lần (Chính xác)."}, {text: "Hàm lượng nước luôn lớn hơn 50mL ở mọi nhiệt độ.", isCorrect: false, rationale: "Ở $8^\circ C$ chỉ đạt 20mL."}, {text: "Nhiệt độ $18^\circ C$ lấy được nhiều nước nhất.", isCorrect: false, rationale: "Nhiệt độ $23^\circ C$ lấy nhiều hơn."}, {text: "Tỉ lệ thuận không giới hạn.", isCorrect: false, rationale: "Nhiệt độ quá cao sẽ làm hỏng rễ."}], hint: "Lấy số liệu $52.8$ chia cho $20$." },
            { id: 72, question: "Có bao nhiêu chất cần cho pha tối của quang hợp trong các chất: $CO_2$, $O_2$, ATP, NADPH, RuBP, G3P?", options: [{text: "3.", isCorrect: true, rationale: "Các chất nguyên liệu/chất nhận trực tiếp cần cho pha tối là $CO_2$, ATP, NADPH (RuBP là chất nhận tuần hoàn)."}, {text: "4.", isCorrect: false, rationale: "Tính dư."}, {text: "2.", isCorrect: false, rationale: "Tính thiếu."}, {text: "5.", isCorrect: false, rationale: "Tính dư $O_2$."}], hint: "Các thành phần đầu vào bắt buộc từ pha sáng và môi trường." },
            { id: 73, question: "Quang hợp có vai trò nào đối với môi trường khí quyển?", options: [{text: "Hấp thụ $CO_2$, giải phóng $O_2$, góp phần điều hòa thành phần khí quyển.", isCorrect: true, rationale: "Quang hợp cân bằng lượng $O_2/CO_2$ cho hành tinh."}, {text: "Hấp thụ $O_2$, giải phóng $CO_2$.", isCorrect: false, rationale: "Đây là vai trò của hô hấp."}, {text: "Hấp thụ nitrogen.", isCorrect: false, rationale: "Quang hợp không hấp thụ $N_2$."}, {text: "Giải phóng nitrogen.", isCorrect: false, rationale: "Không giải phóng $N_2$."}], hint: "Sự trao đổi khí $CO_2$ và $O_2$ của quang hợp." },
            { id: 74, question: "Vị trí diễn ra pha tối của quang hợp trong lục lạp là", options: [{text: "Chất nền (stroma).", isCorrect: true, rationale: "Pha tối chứa các enzyme cố định carbon hòa tan trong chất nền stroma."}, {text: "Màng thylakoid.", isCorrect: false, rationale: "Nơi diễn ra pha sáng."}, {text: "Màng ngoài lục lạp.", isCorrect: false, rationale: "Màng bao bọc."}, {text: "Granum.", isCorrect: false, rationale: "Tập hợp các thylakoid nơi diễn ra pha sáng."}], hint: "Khối chất lỏng lấp đầy không gian lục lạp." },
            { id: 75, question: "Sản phẩm được tạo ra trong pha sáng của quang hợp gồm", options: [{text: "ATP, NADPH và $O_2$.", isCorrect: true, rationale: "Pha sáng chuyển năng lượng ánh sáng thành hóa năng trong ATP, NADPH và giải phóng $O_2$."}, {text: "$CO_2$ và glucose.", isCorrect: false, rationale: "Sản phẩm của pha tối/tổng hợp."}, {text: "ADP, $P_i$ và $NADP^+$.", isCorrect: false, rationale: "Đây là nguyên liệu pha sáng."}, {text: "$H_2O$ và $O_2$.", isCorrect: false, rationale: "$H_2O$ là nguyên liệu."}], hint: "Năng lượng hóa năng và khí giải phóng." },
            { id: 76, question: "Trong 3 giai đoạn chu trình Calvin, có bao nhiêu giai đoạn CẦN SỬ DỤNG năng lượng từ pha sáng (ATP/NADPH)?", options: [{text: "2.", isCorrect: true, rationale: "Giai đoạn khử (dùng ATP, NADPH) và Giai đoạn tái sinh chất nhận RuBP (dùng ATP)."}, {text: "1.", isCorrect: false, rationale: "Thiếu."}, {text: "3.", isCorrect: false, rationale: "Giai đoạn cố định $CO_2$ không dùng ATP."}, {text: "0.", isCorrect: false, rationale: "Sai."}], hint: "Giai đoạn cố định CO2 ban đầu có cần ATP không?" },
            { id: 77, question: "Lục lạp có cấu trúc màng kép, bên trong chứa các đĩa thylakoid xếp chồng thành granum. Phát biểu nào ĐÚNG?", options: [{text: "Diệp lục nằm trên màng thylakoid để thực hiện pha sáng.", isCorrect: true, rationale: "Hệ sắc tố quang hợp phân bố trên màng thylakoid."}, {text: "Diệp lục nằm hòa tan trong chất nền stroma.", isCorrect: false, rationale: "Diệp lục gắn trên màng thylakoid."}, {text: "Pha sáng diễn ra ở màng ngoài lục lạp.", isCorrect: false, rationale: "Diễn ra ở màng thylakoid."}, {text: "Pha tối diễn ra trên màng thylakoid.", isCorrect: false, rationale: "Diễn ra ở stroma."}], hint: "Vị trí định vị của diệp lục trong lục lạp." },
            { id: 78, question: "Để đánh giá kết quả thí nghiệm sắc kí chiết rút sắc tố chính xác, phương án nào HỢP LÝ?", options: [{text: "Dựa vào màu sắc, tính tỉ số di chuyển $R_f$ và lặp lại thí nghiệm để so sánh.", isCorrect: true, rationale: "Sự kết hợp giữa quan sát màu, đo quãng đường di chuyển ($R_f$) và lặp lại thí nghiệm giúp khẳng định chính xác sắc tố."}, {text: "Mọi dải sắc tố luôn ở vị trí giống hệt nhau trong mọi dung môi.", isCorrect: false, rationale: "Vị trí thay đổi tùy thuộc loại dung môi chạy sắc kí."}, {text: "Chỉ cần nhìn màu sắc một lần duy nhất.", isCorrect: false, rationale: "Thiếu độ tin cậy khoa học."}, {text: "Không cần ghi chép lại quãng đường di chuyển.", isCorrect: false, rationale: "Không tính được $R_f$."}], hint: "Nguyên tắc thực nghiệm sắc kí hóa học." },
            { id: 79, question: "Các bước đúng kiểm tra giả thuyết “Ánh sáng cần cho lá cây tạo tinh bột”: (1) Để cây trong tối 48h; (2) Che một phần lá bằng giấy đen; (3) Chiếu sáng rồi luộc cồn tẩy diệp lục; (4) Thử bằng iodine. Thứ tự đúng:", options: [{text: "1 $\\rightarrow$ 2 $\\rightarrow$ 3 $\\rightarrow$ 4.", isCorrect: true, rationale: "Thứ tự thí nghiệm chuẩn để loại bỏ tinh bột cũ, tạo đối chứng bịt giấy và thử màu."}, {text: "2 $\\rightarrow$ 1 $\\rightarrow$ 3 $\\rightarrow$ 4.", isCorrect: false, rationale: "Phải để trong tối trước khi bịt giấy."}, {text: "3 $\\rightarrow$ 2 $\\rightarrow$ 1 $\\rightarrow$ 4.", isCorrect: false, rationale: "Sai quy trình."}, {text: "1 $\\rightarrow$ 3 $\\rightarrow$ 2 $\\rightarrow$ 4.", isCorrect: false, rationale: "Sai quy trình."}], hint: "Phải làm hết tinh bột dự trữ cũ trước khi bắt đầu chiếu sáng." },
            { id: 80, question: "Ở cây khoai tây, nhiệt độ tối ưu cho hiệu suất quang hợp thuần (tích lũy chất khô) thường nằm trong khoảng", options: [{text: "20^\circ C - 25^\circ C.", isCorrect: true, rationale: "Khoai tây là cây ôn đới/ưa mát, quang hợp đạt đỉnh trong khoảng 20-25°C."}, {text: "35^\circ C - 40^\circ C.", isCorrect: false, rationale: "Ở nhiệt độ này hô hấp tăng mạnh làm giảm hiệu suất thuần."}, {text: "5^\circ C - 10^\circ C.", isCorrect: false, rationale: "Nhiệt độ quá thấp ức chế enzyme."}, {text: ">45^\circ C.", isCorrect: false, rationale: "Cây bị tổn thương nhiệt."}], hint: "Khoai tây thuộc nhóm cây trồng mùa lạnh/ưa nhiệt độ ôn hòa." },
            { id: 81, question: "Mùa khô kéo dài, nắng mạnh nhiệt độ cao, người dân nên trồng Ngô ($C_4$) hay Lúa ($C_3$)? Nhận định nào CHƯA HỢP LÝ?", options: [{text: "Nên trồng lúa vì $C_3$ cố định $CO_2$ tốt hơn $C_4$ ở nhiệt độ cao.", isCorrect: true, rationale: "Nhận định này SAI (chưa hợp lý) vì ở nhiệt độ và ánh sáng cao, $C_4$ (ngô) quang hợp và tiết kiệm nước tốt hơn hẳn $C_3$ (lúa)."}, {text: "Ưu tiên trồng ngô vì $C_4$ không có hô hấp sáng, chịu hạn/nhiệt tốt.", isCorrect: false, rationale: "Nhận định này đúng thực tế."}, {text: "Trồng ngô giúp tiết kiệm nước hơn lúa.", isCorrect: false, rationale: "Nhận định này đúng."}, {text: "Thực vật $C_3$ bị giảm năng suất khi nắng nóng do hô hấp sáng.", isCorrect: false, rationale: "Nhận định này đúng."}], hint: "Thực vật nào chịu nóng và hạn tốt hơn?" },
            { id: 82, question: "Chiếu ánh sáng qua lăng kính vào bể tảo lam, vi khuẩn hiếu khí tập trung đông nhất ở vùng ánh sáng nào?", options: [{text: "Vùng đỏ và vùng xanh tím.", isCorrect: true, rationale: "Đây là 2 vùng diệp lục hấp thụ mạnh nhất, quang hợp mạnh nhất thải nhiều $O_2$ nhất thu hút vi khuẩn hiếu khí."}, {text: "Vùng xanh lục.", isCorrect: false, rationale: "Diệp lục phản xạ ánh sáng xanh lục nên quang hợp yếu nhất."}, {text: "Vùng vàng.", isCorrect: false, rationale: "Hấp thụ kém hơn."}, {text: "Phân bố đều khắp bể.", isCorrect: false, rationale: "Tập trung theo mật độ $O_2$."}], hint: "Hai đỉnh hấp thụ chính của phân tử diệp lục." },
            { id: 83, question: "Giải pháp hợp lý cung cấp rau sạch mùa đông lạnh giá ở Mỹ:", options: [{text: "Trồng rau trong nhà kính có chiếu sáng nhân tạo và kiểm soát nhiệt độ.", isCorrect: true, rationale: "Nhà kính cách nhiệt và bổ sung đèn quang hợp giúp rau phát triển bất chấp mùa đông."}, {text: "Khuyên người dân không ăn rau.", isCorrect: false, rationale: "Không giải quyết được nhu cầu dinh dưỡng."}, {text: "Di dời toàn bộ người dân đến vùng nóng.", isCorrect: false, rationale: "Không khả thi."}, {text: "Để rau tự nhiên ngoài trời tuyết.", isCorrect: false, rationale: "Rau sẽ bị đóng băng đóng chết."}], hint: "Ứng dụng nông nghiệp công nghệ cao trong nhà màng." },
            { id: 84, question: "Cho rong đuôi chó vào bể cá cảnh có tác dụng chính là", options: [{text: "Cung cấp oxygen cho cá hô hấp nhờ quá trình quang hợp của rong.", isCorrect: true, rationale: "Rong quang hợp dưới ánh sáng thải $O_2$ hòa tan vào nước cho cá."}, {text: "Cung cấp $CO_2$ cho cá.", isCorrect: false, rationale: "Cá cần $O_2$ để hô hấp chứ không cần $CO_2$."}, {text: "Tăng nhiệt độ nước.", isCorrect: false, rationale: "Rong không phát nhiệt."}, {text: "Làm đục nước bể cá.", isCorrect: false, rationale: "Rong còn giúp lọc sạch nước."}], hint: "Khí thải ra từ quá trình quang hợp của cây thủy sinh." },
            { id: 85, question: "Thóc thu hoạch xong đổ đống lớn bị nóng lên. Biện pháp khắc phục tốt nhất là", options: [{text: "Phơi hoặc sấy khô thóc đến độ ẩm an toàn trước khi bảo quản.", isCorrect: true, rationale: "Giảm độ ẩm hạt làm giảm cường độ hô hấp (hô hấp tỏa nhiệt làm nóng đống thóc)."}, {text: "Tưới thêm nước cho mát.", isCorrect: false, rationale: "Tăng độ ẩm làm hạt nảy mầm và thối nát nhanh hơn."}, {text: "Đóng kín đống thóc lại.", isCorrect: false, rationale: "Giữ nhiệt làm hỏng thóc."}, {text: "Tăng nhiệt độ kho lên $60^\circ C$.", isCorrect: false, rationale: "Làm luộc chín hạt."}], hint: "Khống chế yếu tố độ ẩm để giảm hô hấp hạt." },
            { id: 86, question: "Để bảo quản cà rốt tươi lâu, hạn chế hao hụt chất hữu cơ nên", options: [{text: "Bảo quản ở nhiệt độ thấp thích hợp, duy trì độ ẩm phù hợp và thông khí hợp lý.", isCorrect: true, rationale: "Nhiệt độ thấp ức chế hô hấp, độ ẩm phù hợp chống héo nông sản."}, {text: "Phơi khô kiệt dưới nắng gay gắt.", isCorrect: false, rationale: "Cà rốt tươi sẽ bị hỏng cấu trúc mô."}, {text: "Bảo quản ở nhiệt độ cao $40^\circ C$.", isCorrect: false, rationale: "Thúc đẩy hô hấp làm thối hỏng."}, {text: "Bọc kín trong nilon không cho khí vào.", isCorrect: false, rationale: "Gây hô hấp kị khí tạo cồn làm thối củ."}], hint: "Các điều kiện nhiệt độ và độ ẩm tối ưu cho nông sản tươi." },
            { id: 87, question: "Trong phòng bảo quản nông sản khô (hạt đỗ, thóc), người ta thường", options: [{text: "Hạ thấp nhiệt độ, độ ẩm và nồng độ $O_2$, tăng nồng độ $CO_2$.", isCorrect: true, rationale: "Môi trường $CO_2$ cao, $O_2$ thấp, khô và lạnh ức chế tối đa sự hô hấp của hạt."}, {text: "Duy trì nhiệt độ cao $40^\circ C$.", isCorrect: false, rationale: "Nhiệt độ cao làm hỏng hạt."}, {text: "Bơm thêm khí $O_2$ vào phòng.", isCorrect: false, rationale: "Thúc đẩy hạt hô hấp tiêu hao chất dinh dưỡng."}, {text: "Tăng độ ẩm không khí tối đa.", isCorrect: false, rationale: "Làm hạt nảy mầm."}], hint: "Điều kiện khí quyển nhân tạo để ức chế hô hấp." },
            { id: 88, question: "Thí nghiệm: Chuông A có đĩa hạt nảy mầm + cốc nước vôi trong; Chuông B chỉ có cốc nước vôi trong. Kết quả là", options: [{text: "Cốc nước vôi trong ở chuông A bị đục do hạt hô hấp thải $CO_2$ tạo kết tủa $CaCO_3$.", isCorrect: true, rationale: "Hạt nảy mầm hô hấp mạnh thải $CO_2$, $CO_2 + Ca(OH)_2 \\rightarrow CaCO_3\\downarrow + H_2O$."}, {text: "Cốc ở chuông B bị đục ngầu.", isCorrect: false, rationale: "Chuông B không có hạt hô hấp nên không đục."}, {text: "Cả hai cốc đều trong suốt.", isCorrect: false, rationale: "Chuông A bị đục."}, {text: "Chuông A bị nổ do áp suất.", isCorrect: false, rationale: "Không đúng."}], hint: "Phản ứng của khí CO2 với nước vôi trong." },
            { id: 89, question: "Úp chuông thủy tinh trong thí nghiệm hô hấp ở thực vật nhằm", options: [{text: "ngăn không cho khí $CO_2$ từ không khí bên ngoài xâm nhập vào làm sai lệch kết quả.", isCorrect: true, rationale: "Tạo không gian kín cách ly để đo chính xác lượng $CO_2$ do hạt sinh ra."}, {text: "ngăn ánh sáng.", isCorrect: false, rationale: "Thủy tinh trong suốt không ngăn ánh sáng."}, {text: "cung cấp nhiệt độ.", isCorrect: false, rationale: "Chuông không tự phát nhiệt."}, {text: "ngăn động vật ăn hạt.", isCorrect: false, rationale: "Không phải mục đích khoa học chính của thí nghiệm."}], hint: "Mục đích cách ly không gian khí quyển xung quanh." },
            { id: 90, question: "4 bình đựng hạt: B1 (hạt nhú mầm), B2 (hạt khô), B3 (hạt luộc chín), B4 (hạt nhú mầm ít hơn). Sau 2h, phát biểu nào ĐÚNG?", options: [{text: "Nhiệt độ và nồng độ $CO_2$ ở bình 1 tăng cao nhất.", isCorrect: true, rationale: "Hạt nhú mầm sống hô hấp mạnh nhất giải phóng nhiệt và $CO_2$."}, {text: "Bình 3 có nhiệt độ tăng cao nhất.", isCorrect: false, rationale: "Hạt luộc chín đã chết, không hô hấp."}, {text: "Bình 2 có nồng độ $CO_2$ cao nhất.", isCorrect: false, rationale: "Hạt khô hô hấp cực kỳ yếu."}, {text: "Cả 4 bình đều tăng nhiệt độ như nhau.", isCorrect: false, rationale: "Mức độ hô hấp ở các bình khác nhau."}], hint: "Sự khác biệt về cường độ hô hấp giữa hạt sống nảy mầm, hạt khô và hạt chết." },
            { id: 91, question: "Bố trí thí nghiệm đo sự thay đổi nhiệt độ bằng nhiệt kế cắm vào bình chứa hạt nảy mầm bọc trong bình cách nhiệt dùng để chứng minh", options: [{text: "Quá trình hô hấp ở thực vật có tỏa nhiệt.", isCorrect: true, rationale: "Nhiệt năng giải phóng từ hô hấp làm tăng nhiệt độ trên nhiệt kế."}, {text: "Quá trình hô hấp hấp thụ nhiệt.", isCorrect: false, rationale: "Hô hấp là quá trình tỏa nhiệt."}, {text: "Quang hợp giải phóng nhiệt.", isCorrect: false, rationale: "Thí nghiệm thực hiện với hạt nảy mầm trong tối (hô hấp)."}, {text: "Sự hút nước của hạt.", isCorrect: false, rationale: "Không đo bằng nhiệt kế."}], hint: "Nhiệt kế dùng để đo đại lượng nào giải phóng ra từ hô hấp?" }
        ];

        let currentIndex = 0;
        let scoreCorrect = 0;
        let scoreWrong = 0;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const hintBox = document.getElementById('hint-box');
        const hintBtn = document.getElementById('hint-btn');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const currentIndexEl = document.getElementById('current-index');
        const totalCountEl = document.getElementById('total-count');
        const progressBar = document.getElementById('progress-bar');
        const jumpSelect = document.getElementById('jump-select');

        // Populate jump dropdown
        questionsData.forEach((q, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = `Câu ${q.id}`;
            jumpSelect.appendChild(opt);
        });

        jumpSelect.onchange = (e) => {
            currentIndex = parseInt(e.target.value);
            loadQuestion();
        };

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        // Fisher-Yates Shuffle Algorithm for unbiased randomization
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuestion() {
            const q = questionsData[currentIndex];
            questionText.innerHTML = `Câu ${q.id}: ${q.question}`;
            currentIndexEl.innerText = currentIndex + 1;
            totalCountEl.innerText = questionsData.length;
            jumpSelect.value = currentIndex;
            progressBar.style.width = `${((currentIndex + 1) / questionsData.length) * 100}%`;

            hintBox.classList.add('hidden');
            hintBox.innerText = q.hint || "Không có gợi ý cho câu hỏi này.";
            feedbackBox.classList.add('hidden');

            // Shuffle options each time question is loaded
            const shuffledOptions = shuffleArray(q.options);

            optionsContainer.innerHTML = '';
            shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-3.5 border border-slate-200 rounded-xl bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 font-medium text-sm text-slate-700 flex items-start gap-3";
                btn.innerHTML = `<span class="bg-white border text-slate-500 rounded-md w-6 h-6 flex items-center justify-center text-xs font-bold shrink-0">${String.fromCharCode(65 + idx)}</span> <span>${opt.text}</span>`;
                btn.onclick = () => checkAnswer(opt, shuffledOptions);
                optionsContainer.appendChild(btn);
            });

            renderMath();
        }

        function checkAnswer(selectedOpt, currentShuffledOptions) {
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (currentShuffledOptions[idx].isCorrect) {
                    btn.classList.remove('bg-slate-50');
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                } else if (currentShuffledOptions[idx] === selectedOpt) {
                    btn.classList.remove('bg-slate-50');
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                }
            });

            feedbackBox.classList.remove('hidden');
            if (selectedOpt.isCorrect) {
                scoreCorrect++;
                document.getElementById('score-correct').innerText = scoreCorrect;
                feedbackBox.className = "mt-6 p-4 rounded-xl border bg-green-50 border-green-200 text-green-900";
                feedbackTitle.innerText = "🎉 Chính xác!";
            } else {
                scoreWrong++;
                document.getElementById('score-wrong').innerText = scoreWrong;
                feedbackBox.className = "mt-6 p-4 rounded-xl border bg-red-50 border-red-200 text-red-900";
                feedbackTitle.innerText = "❌ Chưa chính xác!";
            }
            feedbackText.innerHTML = selectedOpt.rationale;
            renderMath();
        }

        hintBtn.onclick = () => hintBox.classList.toggle('hidden');

        nextBtn.onclick = () => {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert(`Bạn đã hoàn thành tất cả 91 câu hỏi!\nKết quả: Đúng ${scoreCorrect} / Sai ${scoreWrong}`);
            }
        };

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
